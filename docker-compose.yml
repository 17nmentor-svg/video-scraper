version: "3.8"

services:
  scraper:
    build: .
    container_name: video-scraper
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/scraper/downloads
      - ./data:/scraper/data
    restart: unless-stopped
    networks:
      - scraper-net

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme123
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - scraper-net

networks:
  scraper-net:
    driver: bridge

volumes:
  n8n_data:
